name: Pull request

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional vitest filter for packages/happy-dom (empty runs the full suite)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Cache node modules
        uses: actions/cache@v4
        id: cache-node-modules
        env:
          cache-name: cache-node-modules
        with:
          path: |
            ./node_modules
            ./packages/*/node_modules
          key: ${{ runner.os }}-${{ matrix.node-version }}-build-${{ env.cache-name }}-${{ hashFiles('./packages/*/package-lock.json') }}-${{ hashFiles('./package-lock.json') }}

      - name: Cache turbo
        uses: actions/cache@v4
        id: cache-turbo
        with:
          path: .turbo
          key: turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.ref_name }}

      - name: Restore turbo cache from master
        if: steps.cache-turbo.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v3
        with:
          path: .turbo
          key: turbo-master
      
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
  
      - name: Set version
        run: node ./node_modules/.bin/happy-set-workspace-version --version=18.0.1

      - name: Compile package
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            cd packages/happy-dom && npx vitest run ${{ inputs.test-filter }}
          else
            npm run test
          fi

      - name: Pack happy-dom
        if: matrix.node-version == 22
        run: |
          mkdir -p ${{ github.workspace }}/seal-dist
          cd packages/happy-dom && npm pack --pack-destination ${{ github.workspace }}/seal-dist

      - name: Upload happy-dom tarball
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: happy-dom-tgz
          path: seal-dist/happy-dom-*.tgz
          if-no-files-found: error
